memory_limit = 512M
upload_max_filesize = 5G
post_max_size = 5G
max_execution_time = 600
max_input_time = 600
max_input_vars = 5000
date.timezone = UTC

display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
